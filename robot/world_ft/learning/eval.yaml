# world_ft box-flip policy eval — BACKGROUND stack (right arm, no leader).
#
# This manifest runs only the non-interactive workers. The interactive eval_controller runs
# in its OWN terminal (below) so you can see its prints and its global keyboard listener does
# not collide with the process-compose TUI.
#
# Launch (two terminals, both from the repo root; pick the ckpt via WORLD_FT_MODEL):
#   1) background stack (hapticworld env):
#        WORLD_FT_MODEL=it_sim process-compose -f world_ft/learning/eval.yaml
#   2) controller in its own terminal (hapticworld env), SAME selector:
#        python world_ft/learning/eval_controller.py --redis-port 6379 --model it_sim
#      -> place the arm on the table, then in THAT terminal:  h = home,  ENTER/g = roll out,  s = stop
#
# The model_inference_worker waits until the controller publishes tau_interaction_R, so start the
# stack first, then the controller. Data flow:
#   camera_head --(6380)--> model_inference_worker (reads follower_right_state + tau_interaction_R)
#   model chunk --(6379)--> eval_controller --> follower_right_mit_command --> mit controller
#   eval_controller also publishes tau_interaction_R (measured torque - gravity-comp feedforward)

environment:
  - "PYTHONUNBUFFERED=1"

processes:

  perception_redis:
    description: Redis server (perception bus)
    command: >
      redis-server --save "" --appendonly no --notify-keyspace-events Kg$ --port 6380
    ready_log_line: "Ready to accept connections"
    availability:
      restart: "exit_on_failure"

  camera_head:  # realsense (no --vis; the inference worker shows the obs image)
    command: >
      python nova/workers/realsense_camera_uncompressed.py
      --redis-port 6380
      --stream-key camera_head
    ready_log_line: "camera ready"
    depends_on:
      perception_redis:
        condition: process_log_ready
    shutdown:
      signal: 2
      timeout_ms: 3000

  control_redis:
    description: Redis server (control bus)
    command: '$([ "$(uname)" = "Darwin" ] && echo "" || echo "taskset -c 15") redis-server --save "" --appendonly no --notify-keyspace-events Kg$ --port 6379'
    ready_log_line: "Ready to accept connections"
    availability:
      restart: "exit_on_failure"

  follower_mit_controller_right:
    description: openarm right follower mit controller
    command: python nova/workers/damiao_chain_mit_controller.py --redis-port 6379 --input-name follower_right_mit_command --output-name follower_right_state --can-channel can3
    ready_log_line: "damiao chain mit controller ready"
    depends_on:
      control_redis:
        condition: process_log_ready
    shutdown:
      signal: 2

  # --- rollout recording (idle until eval_controller --save triggers them; one episode per
  #     ENTER->s rollout, saved to data/eval_rollouts/$WORLD_FT_MODEL/<timestamp>/) ---
  video_recorder:
    description: records camera_head.mp4 per eval rollout (triggered by eval_controller --save)
    command: >
      python nova/workers/video_recorder.py
      --redis-port 6380
      --camera-stream-key camera_head
      --output-dir "../data/eval_rollouts/${WORLD_FT_MODEL:-manual}"
    ready_log_line: "video recorder of camera_head starting"
    depends_on:
      camera_head:
        condition: process_log_ready
    shutdown:
      signal: 2

  low_dim_npy_recorder:
    description: records robot state/command/torque + policy chunks per eval rollout
    command: >
      python nova/workers/low_dim_npy_recorder.py
      --redis-port 6379
      --output-dir "../data/eval_rollouts/${WORLD_FT_MODEL:-manual}"
      --low-dim-stream-mapping-config-path world_ft/eval_recording_config.yaml
    depends_on:
      control_redis:
        condition: process_log_ready
    shutdown:
      signal: 2

  model_inference_worker:
    description: ACT policy inference worker (waits for tau_interaction_R
      from the separately-run eval_controller)
    # Checkpoint = $WORLD_FT_MODEL (default it_sim). Select at launch, e.g.:
    #     WORLD_FT_MODEL=i_real process-compose -f world_ft/learning/eval.yaml
    # Value: explicit model.pth OR a selector for the LATEST matching ckpt:
    #   i = image-only | it = image+torque | its = image+state+torque
    #   optional training-domain suffix _real / _sim, e.g. it_sim, i_real (bare = either domain)
    # Pass the SAME selector to eval_controller (--model ...) so its home pose matches.
    # --match-blur-res defaults to AUTO (sim-trained -> 128, real-trained -> 0).
    command: >
      python world_ft/learning/eval_inference_worker.py
      --model-path "${WORLD_FT_MODEL:-it_sim}"
      --perception-redis-port 6380
      --control-redis-port 6379
    ready_log_line: "model inference worker ready"
    depends_on:
      camera_head:
        condition: process_log_ready
      follower_mit_controller_right:
        condition: process_log_ready
    shutdown:
      signal: 2
      timeout_ms: 3000
