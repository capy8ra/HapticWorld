# Milestone 1 (visual only) — world-model teleop, control side.

# Launches only what's needed to feed the world model and float the right leader:
#   * control_redis            : the message bus (localhost:6379)
#   * leader_mit_controller_right : reads/commands the right LEADER arm over CAN (can1)
#       NOTE: with the follower dongle unplugged, the leader dongle renumbered
#       can2/can3 -> can0/can1, so the RIGHT leader is now can1 (left leader = can0).
#       If followers are reconnected, this shifts back to can3 (see collect_data.yaml).
#   * leader_home_and_float    : homes the leader to the seed pose, then gravity-comp float
#
# NOT here (run separately from worldsim/, in its own terminal):
#   python scripts/inference/wm_follower_worker.py \
#     --ckpt outputs/world_ft_stage_2/<ts>/checkpoints/last.ckpt \
#     --seed-episode data/world_ft_seed_0713/val/episode_0.hdf5
#
# IMPORTANT: use the SAME --seed-episode here and in the worker so the leader pose and
# the sim scene start consistent. Keep a hand near the e-stop during homing.
#
# No follower, no camera, no leader_left — the world model generates the image.

environment:
  - "PYTHONUNBUFFERED=1"

processes:

  control_redis:
    description: Redis server (control bus)
    command: '$([ "$(uname)" = "Darwin" ] && echo "" || echo "taskset -c 15") redis-server --save "" --appendonly no --notify-keyspace-events Kg$ --port 6379'
    ready_log_line: "Ready to accept connections"
    availability:
      restart: "exit_on_failure"

  leader_mit_controller_right:
    description: openarm right leader mit controller
    command: python nova/workers/damiao_chain_mit_controller.py --redis-port 6379 --input-name leader_right_mit_command --output-name leader_right_state --can-channel can1
    ready_log_line: "damiao chain mit controller ready"
    depends_on:
      control_redis:
        condition: process_log_ready
    shutdown:
      signal: 2

  leader_home_and_float:
    description: home right leader to the seed pose, then gravity-comp float
    command: python world_ft/leader_home_and_float.py --redis-port 6379 --seed-episode ../data/wm_seed_live/episode_0.hdf5
    ready_log_line: "leader float ready"
    depends_on:
      leader_mit_controller_right:
        condition: process_log_ready
    shutdown:
      signal: 2
