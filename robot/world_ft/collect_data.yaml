environment:
  - "PYTHONUNBUFFERED=1"

processes:

  # perception redis and camreras

  perception_redis:
    description: Redis server
    command: >
      redis-server --save "" --appendonly no --notify-keyspace-events Kg$ --port 6380
    ready_log_line: "Ready to accept connections"
    availability:
      restart: "exit_on_failure"

  camera_head:  # realsense
    command: >
      python nova/workers/realsense_camera_uncompressed.py
      --redis-port 6380
      --stream-key camera_head
      --vis
    ready_log_line: "camera ready"
    shutdown:
      signal: 2
      timeout_ms: 3000
  
  # control redis and controllers

  control_redis:
    description: Redis server
    command: '$([ "$(uname)" = "Darwin" ] && echo "" || echo "taskset -c 15") redis-server --save "" --appendonly no --notify-keyspace-events Kg$ --port 6379'
    ready_log_line: "Ready to accept connections"
    availability:
      restart: "exit_on_failure"

  follower_mit_controller_left:
    description: openarm left follower mit controller
    command: python nova/workers/damiao_chain_mit_controller.py --redis-port 6379 --input-name follower_left_mit_command --output-name follower_left_state --can-channel can2
    ready_log_line: "damiao chain mit controller ready"
    shutdown:
      signal: 2

  follower_mit_controller_right:
    description: openarm right follower mit controller
    command: python nova/workers/damiao_chain_mit_controller.py --redis-port 6379 --input-name follower_right_mit_command --output-name follower_right_state --can-channel can3
    ready_log_line: "damiao chain mit controller ready"
    shutdown:
      signal: 2

  leader_mit_controller_left:
    description: openarm left leader mit controller
    command: python nova/workers/damiao_chain_mit_controller.py --redis-port 6379 --input-name leader_left_mit_command --output-name leader_left_state --can-channel can0
    ready_log_line: "damiao chain mit controller ready"
    shutdown:
      signal: 2

  leader_mit_controller_right:
    description: openarm right leader mit controller
    command: python nova/workers/damiao_chain_mit_controller.py --redis-port 6379 --input-name leader_right_mit_command --output-name leader_right_state --can-channel can1
    ready_log_line: "damiao chain mit controller ready"
    shutdown:
      signal: 2
  
  # follower_vis:
  #   description: openarm teleop solver
  #   command: python nova/robot/openarm1/teleop_vis.py --redis-port 6379 --left follower_left --right follower_right
  #   ready_log_line: "teleop vis ready"
  #   depends_on:
  #     follower_mit_controller_left:
  #       condition: process_log_ready
  #     follower_mit_controller_right:
  #       condition: process_log_ready
  
  # leader_vis:
  #   description: openarm teleop solver
  #   command: python nova/robot/openarm1/teleop_vis.py --redis-port 6379 --left leader_left --right leader_right
  #   ready_log_line: "teleop vis ready"
  #   depends_on:
  #     leader_mit_controller_left:
  #       condition: process_log_ready
  #     leader_mit_controller_right:
  #       condition: process_log_ready
  
  follower_solver:
    description: openarm teleop solver
    command: python nova/robot/openarm1/teleop_follower_solver.py --redis-port 6379
    ready_log_line: "teleop solver ready"
    depends_on:
      follower_mit_controller_left:
        condition: process_log_ready
      follower_mit_controller_right:
        condition: process_log_ready
      leader_mit_controller_left:
        condition: process_log_ready
      leader_mit_controller_right:
        condition: process_log_ready

  leader_solver:
    description: openarm teleop solver
    command: python nova/robot/openarm1/teleop_leader_solver.py --redis-port 6379
    ready_log_line: "teleop solver ready"
    depends_on:
      follower_mit_controller_left:
        condition: process_log_ready
      follower_mit_controller_right:
        condition: process_log_ready
      leader_mit_controller_left:
        condition: process_log_ready
      leader_mit_controller_right:
        condition: process_log_ready
      follower_solver:
        condition: process_log_ready

  tau_interaction_publisher:
    description: Publish follower interaction torque (actual - gravity-comp feedforward)
    command: python world_ft/tau_interaction_publisher.py --redis-port 6379
    ready_log_line: "tau interaction publisher ready"
    depends_on:
      follower_solver:
        condition: process_log_ready
    shutdown:
      signal: 2

  # video recorder

  video_recorder_head:
    description: Video Recorder Worker
    command: >
      python nova/workers/video_recorder.py
      --redis-host localhost
      --redis-port 6380
      --output-dir world_ft/data/collecting
      --camera-stream-key camera_head
      --video-gop-size 10
    ready_log_line: "video recorder ready"
    depends_on:
      perception_redis:
        condition: process_log_ready
      control_redis:
        condition: process_log_ready
      camera_head:
        condition: process_log_ready
    shutdown:
      signal: 2
      timeout_ms: 3000
  
  low_dim_recorder:
    description: Low Dimensional Data Recorder Worker
    command: >
      python nova/workers/low_dim_npy_recorder.py
      --redis-host localhost
      --redis-port 6379
      --output-dir world_ft/data/collecting
      --low-dim-stream-mapping-config-path "world_ft/collect_data_recording_config.yaml"
    ready_log_line: "low_dim recorder ready"
    depends_on:
      control_redis:
        condition: process_log_ready
      follower_solver:
        condition: process_log_ready
      tau_interaction_publisher:
        condition: process_log_ready
    shutdown:
      signal: 2
      timeout_ms: 3000
  
  collect_data:
    description: Collect Data Worker
    command: >
      python nova/workers/collect_data.py
      --control-redis-host localhost
      --control-redis-port 6379
      --perception-redis-host localhost
      --perception-redis-port 6380
      --recording-camera-names camera_head
      --output-dir world_ft/data/collecting
    ready_log_line: "collect data ready"
    depends_on:
      perception_redis:
        condition: process_log_ready
      control_redis:
        condition: process_log_ready
      video_recorder_head:
        condition: process_log_ready
    shutdown:
      signal: 2
      timeout_ms: 3000
