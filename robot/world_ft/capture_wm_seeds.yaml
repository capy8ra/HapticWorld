# Seed-capture stack for the in-simulator policy rollout: right-arm TELEOP + head camera.
# Like collect_data.yaml (right arm only): on startup the leader floats with gravity comp and the
# follower synchronizes to the leader's pose; the human poses the follower via the leader, arranges
# the box, and snapshots one seed per ENTER press. TWO terminals, both from the repo root:
#
#   1) this stack (hapticworld):
#        process-compose -f world_ft/capture_wm_seeds.yaml
#   2) the capture tool (hapticworld) -- re-pose arm + box, ENTER, repeat:
#        python world_ft/capture_wm_seeds.py
#
# CAN: both dongles connected -> right leader = can1, right follower = can3 (as collect_data.yaml).
# SAFETY: the follower JUMPS to the leader's pose when the solver starts (same as collect_data) --
# put the leader near the follower's pose before launching, clear the workspace, hand on the e-stop.

environment:
  - "PYTHONUNBUFFERED=1"

processes:

  perception_redis:
    description: Redis server (perception bus)
    command: >
      redis-server --save "" --appendonly no --notify-keyspace-events Kg$ --port 6380
    ready_log_line: "Ready to accept connections"
    availability:
      restart: "exit_on_failure"

  camera_head:
    command: >
      python nova/workers/realsense_camera_uncompressed.py
      --redis-port 6380
      --stream-key camera_head
    ready_log_line: "camera ready"
    depends_on:
      perception_redis:
        condition: process_log_ready
    shutdown:
      signal: 2
      timeout_ms: 3000

  control_redis:
    description: Redis server (control bus)
    command: '$([ "$(uname)" = "Darwin" ] && echo "" || echo "taskset -c 15") redis-server --save "" --appendonly no --notify-keyspace-events Kg$ --port 6379'
    ready_log_line: "Ready to accept connections"
    availability:
      restart: "exit_on_failure"

  leader_mit_controller_right:
    description: openarm right leader mit controller (can1)
    command: python nova/workers/damiao_chain_mit_controller.py --redis-port 6379 --input-name leader_right_mit_command --output-name leader_right_state --can-channel can1
    ready_log_line: "damiao chain mit controller ready"
    depends_on:
      control_redis:
        condition: process_log_ready
    shutdown:
      signal: 2

  follower_mit_controller_right:
    description: openarm right follower mit controller (can3)
    command: python nova/workers/damiao_chain_mit_controller.py --redis-port 6379 --input-name follower_right_mit_command --output-name follower_right_state --can-channel can3
    ready_log_line: "damiao chain mit controller ready"
    depends_on:
      control_redis:
        condition: process_log_ready
    shutdown:
      signal: 2

  leader_float_right:
    description: right leader gravity-comp float (kp=kd=0) -- pose it by hand, it stays
    command: python world_ft/teleop_leader_float_right.py --redis-port 6379
    ready_log_line: "leader float ready"
    depends_on:
      leader_mit_controller_right:
        condition: process_log_ready
    shutdown:
      signal: 2

  teleop_follower_solver_right:
    description: right follower mirrors the right leader (leader q -> follower mit_command:q + gravity comp)
    command: python world_ft/teleop_follower_solver_right.py --redis-port 6379
    ready_log_line: "teleop follower solver ready"
    depends_on:
      leader_mit_controller_right:
        condition: process_log_ready
      follower_mit_controller_right:
        condition: process_log_ready
    shutdown:
      signal: 2
