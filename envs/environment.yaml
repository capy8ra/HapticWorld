# HapticWorld -- one environment for world-model training/inference and ACT policy training.
#   conda env create -f envs/environment.yaml
#   conda activate hapticworld
name: hapticworld
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pinocchio>=3.2      # dynamics/IK; conda-forge build includes the MJCF loader
  - pip
  - pip:
      - torch>=2.7
      - torchvision
      - lightning==2.6.0
      - diffusers==0.29.2
      - accelerate
      - einops
      - hydra-core
      - omegaconf
      - wandb
      - wandb-osh
      - imageio-ffmpeg
      - moviepy          # wandb validation videos
      - h5py
      - av
      - opencv-python
      - numpy==1.26.4
      - scipy
      - matplotlib
      - kornia==0.6.0
      - rotary-embedding-torch
      - transforms3d
      - zarr<3
      - ipython             # imported by the vendored ACT/DETR code
      - huggingface_hub
      - colorama
      - git+https://github.com/WangYixuan12/yixuan_utilities.git
      - imagecodecs
      - numba
      # optional, only for dataset.aug_mode != none: git+https://github.com/erjel/imgaug.git@test
