# State-conditioned stage-2: trunk torque head + autoregressive state branch.
# NEW pipeline (latent_world_model_state.py); the plain trunk/separate and
# factored configs are untouched.
defaults:
  - latent_world_model_torque

# inherit the trunk head as the torque path (kept unchanged for comparability)
torque_head_source: trunk_midblock

# measured joint state (episode qpos_right)
state_dim: 8

# scene-branch FiLM condition = [q_des(8), q_measured(8)]
cond_dim: 16

state_branch:
  feat_dim: 128
  hidden_dim: 256
  num_layers: 2
  # smooth bound (out_clamp * tanh(s/out_clamp)) on normalized predicted state
  # (data range [-1,1]); keeps long unrolls bounded with nonzero gradient
  # everywhere -- a hard clamp traps saturated outputs permanently
  out_clamp: 3.0

# dense chunk loss over the autoregressive unroll (normalized units, O(1) scale)
w_state: 1.0
# train-time noise on the measured-q condition slice so rollout-time
# model-predicted states stay in-distribution
cond_state_noise_std: 0.02

dynamics:
  action_dim: ${algorithm.cond_dim}
